name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/build.py
      - run: python scripts/validate.py
      - run: python scripts/build_size_receipt.py
      - run: python scripts/build_release_receipt.py
      - run: python -m unittest discover -s tests -p "test_*.py"

